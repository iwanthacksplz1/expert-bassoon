
name: Build TerraStyle

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build plugin
        run: gradle clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: TerraStyle-1.0.2
          path: build/libs/TerraStyle-1.0.2.jar
